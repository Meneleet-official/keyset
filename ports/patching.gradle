// Shared by every port build: applies the per-version unified diffs in `patches/` on top of the
// generated copy of common/src/client. Ports therefore store only how they differ from the
// main (26.3) sources instead of full copies of each file.
ext.keysetApplyPatches = { File patchRoot, File targetRoot ->
    if (!patchRoot.isDirectory()) return
    fileTree(patchRoot).matching { include '**/*.patch' }.files.sort().each { File patch ->
        String relative = patchRoot.toPath().relativize(patch.toPath()).toString().replace(File.separator, '/')
        File target = new File(targetRoot, relative.substring(0, relative.length() - '.patch'.length()))
        if (!target.isFile()) throw new GradleException("Patch $relative has no target ${target}")
        String original = target.getText('UTF-8')
        boolean crlf = original.contains('\r\n')
        List<String> lines = original.replace('\r\n', '\n').split('\n', -1) as List<String>

        List<Map> hunks = []
        Map current = null
        patch.getText('UTF-8').replace('\r\n', '\n').split('\n').each { String line ->
            def header = line =~ /^@@ -(\d+)(?:,\d+)? \+\d+(?:,\d+)? @@/
            if (header.find()) {
                current = [start: (header.group(1) as int) - 1, old: [], neu: []]
                hunks << current
            } else if (current != null && !line.startsWith(String.valueOf((char) 92))) {
                if (line.startsWith('+')) current.neu << line.substring(1)
                else if (line.startsWith('-')) current.old << line.substring(1)
                else if (line.startsWith(' ')) { current.old << line.substring(1); current.neu << line.substring(1) }
            }
        }

        int delta = 0
        hunks.each { Map hunk ->
            List<String> old = hunk.old
            int expected = hunk.start + delta
            int found = -1
            int limit = Math.max(expected, lines.size())
            for (int distance = 0; distance <= limit && found < 0; distance++) {
                for (int candidate : [expected - distance, expected + distance]) {
                    if (candidate >= 0 && candidate + old.size() <= lines.size()
                            && lines.subList(candidate, candidate + old.size()) == old) { found = candidate; break }
                }
            }
            if (found < 0) {
                throw new GradleException("Patch $relative no longer applies (hunk near line ${hunk.start + 1}); "
                        + 'the main sources changed, regenerate it with scripts/make-port-patch.py')
            }
            for (int i = 0; i < old.size(); i++) lines.remove(found)
            lines.addAll(found, hunk.neu as List<String>)
            delta += hunk.neu.size() - old.size()
        }
        String result = lines.join('\n')
        target.setText(crlf ? result.replace('\n', '\r\n') : result, 'UTF-8')
    }
}
