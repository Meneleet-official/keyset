plugins { id 'net.fabricmc.fabric-loom' }
base { archivesName = 'keyset-fabric' }
repositories { maven { url = 'https://maven.terraformersmc.com/' } }
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly('com.terraformersmc:modmenu:20.0.3') { transitive = false }
    include implementation('net.fabricmc.fabric-api:fabric-api-base:2.0.4+ece063239e')
    include implementation('net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.13+9edec1269e')
}
sourceSets.main.java.srcDir('../../../fabric/src/client/java')
sourceSets.main.resources.srcDir('src/client/resources')
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
