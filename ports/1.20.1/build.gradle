plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.147' apply false
}

group = 'dev.keyset'
version = "${mod_version}+mc${minecraft_version}"

allprojects {
    group = rootProject.group
    version = rootProject.version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.terraformersmc.com/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

subprojects {
    plugins.withId('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 17
        }
        tasks.withType(Jar).configureEach {
            from(rootProject.file('../../LICENSE'))
            from(rootProject.file('../../LICENSE-KEYBOARD-DATA.txt'))
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
    }
}

tasks.register('collectMods', Sync) {
    dependsOn ':fabric:assemble', ':neoforge:assemble'
    from(project(':fabric').layout.buildDirectory.dir('libs')) {
        include "keyset-fabric-${project.version}.jar"
    }
    from(project(':neoforge').layout.buildDirectory.dir('libs')) {
        include "keyset-neoforge-${project.version}.jar"
    }
    into layout.buildDirectory.dir('mods')
}

tasks.named('build') { dependsOn 'collectMods' }
