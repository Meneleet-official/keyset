version: 2.1
jobs:
  build:
    docker:
      - image: eclipse-temurin:25-jdk
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
      - run: bash ./gradlew build --no-daemon
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v2-gradle-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "build.gradle" }}
      - store_test_results:
          path: common/build/test-results
      - store_artifacts:
          path: build/mods
workflows:
  build:
    jobs:
      - build
